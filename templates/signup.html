{% extends "base.html" %}
{% block title %}Sign up - Stocker{% endblock %}
{% block content %}
<h2>Create account</h2>
<form method="post">
<label for="username">Username</label>
<input id="username" name="username" placeholder="Username" required>
<label for="email">Email</label>
<input id="email" name="email" type="email" placeholder="Email" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" placeholder="Password (min 6 chars)" required>
<label for="role">Role</label>
<select id="role" name="role"><option value="trader">Trader</option><option value="admin">Admin</option></select>
<button type="submit">Sign up</button>
</form>
<p><a href="{{ url_for('login') }}">Already have an account? Log in</a></p>
{% endblock %}
