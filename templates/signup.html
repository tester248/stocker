<!doctype html><html><head><meta charset="utf-8"><title>Sign up - Stocker</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><div class="container"><h2>Create account</h2>{% with m=get_flashed_messages(with_categories=true) %}{% for c,msg in m %}<div class="flash {{c}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input name="username" placeholder="Username" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (min 6)" required><select name="role"><option value="trader">Trader</option><option value="admin">Admin</option></select><button type="submit">Sign up</button></form><p><a href="{{ url_for('login') }}">Already have an account? Log in</a></p></div></body></html>
