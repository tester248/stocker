{% extends "base.html" %}
{% block title %}Login - Stocker{% endblock %}
{% block content %}
<div class="max-w-md mx-auto glass p-6 mt-6">
<h2 class="text-2xl font-bold">Welcome back</h2>
<form method="post" class="mt-4">
<label class="flabel" for="email">Email</label>
<input class="field" id="email" name="email" type="email" placeholder="Email" required>
<label class="flabel" for="password">Password</label>
<input class="field" id="password" name="password" type="password" placeholder="Password" required>
<button class="btn-primary w-full mt-2" type="submit">Login</button>
</form>
<p class="text-sm text-slate-400 mt-4"><a class="text-accent underline" href="{{ url_for('signup') }}">No account? Sign up</a></p>
</div>
{% endblock %}
