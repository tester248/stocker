<!doctype html><html><head><meta charset="utf-8"><title>Login - Stocker</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><div class="container"><h2>Login</h2>{% with m=get_flashed_messages(with_categories=true) %}{% for c,msg in m %}<div class="flash {{c}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button type="submit">Login</button></form><p><a href="{{ url_for('signup') }}">No account? Sign up</a></p></div></body></html>
