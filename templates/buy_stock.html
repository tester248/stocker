<!doctype html><html><head><meta charset="utf-8"><title>Buy - Stocker</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><div class="container"><h2>Buy stock</h2>{% with m=get_flashed_messages(with_categories=true) %}{% for c,msg in m %}<div class="flash {{c}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input name="symbol" placeholder="SYMBOL e.g. INFY" required><input name="quantity" type="number" min="1" value="1" required><button>Buy</button></form><div class="card"><h3>Available</h3><table><tr><th>Symbol</th><th>Price</th></tr>{% for s in stocks or [] %}<tr><td>{{ s.symbol }}</td><td>{{ s.price }}</td></tr>{% endfor %}</table></div></div></body></html>
