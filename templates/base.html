<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Stocker{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2322c55e'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='%23062a0f' font-family='Arial' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav>
<a class="brand" href="{{ url_for('index') }}">STOCKER</a>
<div>
{% block nav %}
<a href="{{ url_for('index') }}">Home</a>
<a href="{{ url_for('login') }}">Login</a>
<a class="btn" href="{{ url_for('signup') }}">Sign up</a>
{% endblock %}
</div>
</nav>
<div class="container">
{% with m=get_flashed_messages(with_categories=true) %}
{% for c,msg in m %}<div class="flash {{c}}">{{msg}}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
