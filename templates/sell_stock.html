<!doctype html><html><head><meta charset="utf-8"><title>Sell - Stocker</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><div class="container"><h2>Sell stock</h2>{% with m=get_flashed_messages(with_categories=true) %}{% for c,msg in m %}<div class="flash {{c}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input name="symbol" placeholder="SYMBOL e.g. INFY" required><input name="quantity" type="number" min="1" value="1" required><button>Sell</button></form>{% if holdings %}<div class="card"><h3>Your holdings</h3><table><tr><th>Symbol</th><th>Qty</th></tr>{% for h in holdings %}<tr><td>{{ h.symbol }}</td><td>{{ h.quantity }}</td></tr>{% endfor %}</table></div>{% endif %}</div></body></html>
